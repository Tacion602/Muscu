<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Séance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Accueil : choix du jour -->
<section id="ecran-accueil" class="ecran actif">
  <header class="entete-accueil">
    <h1>Séance</h1>
    <button id="bouton-reglages" class="icone" aria-label="Réglages">&#9881;</button>
  </header>

  <!-- Séances en cours : une ligne par jour commencé, chacune avec son propre
       abandon. Reprendre se fait en touchant la carte du jour plus bas. -->
  <div id="reprise" class="reprise" hidden>
    <p class="reprise-titre">Séances en cours</p>
    <div id="reprise-liste"></div>
  </div>

  <ul id="liste-jours" class="liste-jours"></ul>

  <div class="pied-accueil">
    <p id="etat-sync" class="etat-sync"></p>
    <button id="bouton-historique" class="discret">Séances enregistrées</button>
  </div>
</section>

<!-- Séance : un exercice, plein écran -->
<section id="ecran-seance" class="ecran">
  <header class="barre">
    <button id="bouton-quitter" class="icone" aria-label="Retour">&#8592;</button>
    <div class="barre-titre">
      <span id="seance-jour"></span>
      <span id="seance-progression" class="compteur"></span>
    </div>
    <button id="bouton-terminer" class="icone" aria-label="Terminer">&#10003;</button>
  </header>

  <div id="jauge" class="jauge"><div id="jauge-remplie"></div></div>

  <main class="corps">
    <div id="bloc-muscu">
      <div class="ligne-titre">
        <h2 id="exo-nom"></h2>
        <button id="chrono-seance-demarrer" class="chrono-seance vert" type="button" aria-label="Démarrer le chronomètre de séance">
          <span class="chrono-seance-icone">&#9654;</span>
          <span id="chrono-seance-temps" class="chrono-seance-temps"></span>
        </button>
      </div>

      <div class="etiquettes">
        <span id="exo-muscle" class="etiquette"></span>
        <span id="exo-prescription" class="etiquette"></span>
        <span id="exo-rir" class="etiquette"></span>
      </div>

      <div id="echauffement-jour" class="echauffement-jour" hidden>
        <p class="echauffement-titre">Échauffement, environ 5 min</p>
        <ol id="echauffement-liste"></ol>
      </div>

      <!-- Consigne et minuterie de récupération côte à côte : la seconde
           n'apparaît qu'active, la première reprend alors toute la largeur.
           Un appui n'importe où sur la minuterie passe à la suite. Voir
           minuterieTerminee() dans js/app.js. -->
      <div class="ligne-consigne">
        <details id="exo-consigne-bloc" class="consigne" open>
          <summary>Consigne technique</summary>
          <p id="exo-consigne"></p>
          <textarea id="exo-consigne-champ" class="consigne-champ" rows="3" hidden></textarea>
          <div class="consigne-boutons">
            <button id="bouton-consigne-modifier" class="discret" type="button">Modifier</button>
            <button id="bouton-consigne-enregistrer" class="discret" type="button" hidden>Enregistrer</button>
            <button id="bouton-consigne-annuler" class="discret" type="button" hidden>Annuler</button>
          </div>
        </details>

        <div id="minuterie" class="minuterie" hidden>
          <span id="minuterie-chiffres" class="minuterie-chiffres">0:00</span>
        </div>
      </div>

      <div class="tableau-titres">
        <span class="col-saisie">Charge</span>
        <span class="col-saisie">Reps</span>
        <span class="col-rir">RIR</span>
        <span class="col-suppr"></span>
      </div>
      <ol id="series" class="series"></ol>

      <button id="bouton-serie" class="ajouter">+ Ajouter une série</button>

      <div class="tonnage">
        <span>Tonnage <strong id="tonnage-actuel">0</strong></span>
        <span id="tonnage-compare" class="compare"></span>
      </div>
    </div>

    <div id="bloc-footing" hidden>
      <h2 id="footing-nom">Footing</h2>

      <div id="footing-types" class="footing-types"></div>

      <div id="echauffement-footing" class="echauffement-jour">
        <p class="echauffement-titre">Avant de partir</p>
        <ol id="echauffement-footing-liste"></ol>
      </div>

      <!-- Un ou plusieurs passages du type choisi, chacun avec ses propres
           chiffres (demande de l'utilisateur le 8 septembre 2026 : pouvoir
           faire plusieurs passages en Incliné à des charges différentes dans
           la même séance). Rempli par rendreCyclesCourse() dans js/app.js. -->
      <div id="footing-cycles"></div>
      <button id="bouton-cycle-ajouter" class="ajouter" type="button">+ Ajouter un passage</button>

      <!-- Gainage du jour, commun aux quatre types de course. Rempli par
           rendreGainage() dans js/app.js à partir de GAINAGE_FOOTING. -->
      <section class="footing-gainage">
        <h3 class="footing-gainage-titre">Gainage</h3>
        <div id="footing-gainage-liste"></div>
      </section>
    </div>
  </main>

  <nav class="navigation">
    <button id="bouton-precedent" class="nav">&#8592; Exercice</button>
    <button id="bouton-suivant" class="nav">Exercice &#8594;</button>
  </nav>
</section>

<!--
  Champ d'amorce du clavier virtuel. Permanent dans le DOM depuis le
  chargement, invisible mais focusable : c'est lui qu'on focalise en premier
  au sein d'un geste utilisateur pour faire ouvrir le clavier, avant de passer
  la main au vrai champ de saisie. Voir focaliserProchaineSerie dans app.js.
  Ne jamais lui mettre display:none ni visibility:hidden, qui le rendraient
  infocusable et annuleraient tout le mécanisme.
-->
<input id="amorce-clavier" class="amorce-clavier" type="text"
       inputmode="decimal" tabindex="-1" aria-hidden="true">

<!-- Fin de séance -->
<section id="ecran-fin" class="ecran">
  <header class="barre">
    <button id="bouton-fin-retour" class="icone" aria-label="Retour">&#8592;</button>
    <div class="barre-titre"><span>Séance terminée</span></div>
    <span class="icone"></span>
  </header>
  <main class="corps">
    <div id="fin-resume" class="resume"></div>

    <!-- Remarque libre de fin de séance, ajoutée le 8 septembre 2026 : elle
         part dans le classeur avec la séance (onglet Remarques), pour que le
         développeur la lise en dehors de l'application et en tienne compte
         dans les évolutions. Liée à seance.remarque, enregistrée à la frappe
         comme le reste de la séance en cours. -->
    <label class="champ-large">
      <span>Remarque pour le développeur</span>
      <textarea id="fin-remarque" class="consigne-champ" rows="3" placeholder="Douleur, gêne, idée d'amélioration, ce que vous voulez signaler pour la prochaine mise à jour de l'application."></textarea>
    </label>

    <!-- Blessure du jour, ajoutée le 9 septembre 2026 : elle part dans une
         page à part du classeur (onglet Blessures), avec la date, la série
         concernée et sa description. Distincte de la remarque, qui s'adresse
         au développeur : celle-ci suit le corps dans le temps. La liste des
         exercices de la séance est proposée en suggestions, sans interdire
         d'écrire autre chose (une douleur peut ne tenir à aucune série). -->
    <label class="champ-large">
      <span>Blessure ou douleur</span>
      <input id="fin-blessure-serie" list="fin-blessure-exercices" type="text"
             placeholder="Série concernée, par exemple Curl marteau série 3">
      <datalist id="fin-blessure-exercices"></datalist>
      <textarea id="fin-blessure-texte" class="consigne-champ" rows="2" placeholder="Ce que vous avez ressenti, où, à quel moment. Laissez vide s'il n'y a rien à signaler."></textarea>
    </label>

    <!-- Signale les exercices restés sans aucune série validée, sans jamais
         empêcher l'envoi : une séance écourtée est une séance, et l'oubli
         d'un exercice se voit mieux ici qu'une fois le classeur rempli.
         Rempli par preparerEcranFin() dans js/app.js. -->
    <p id="fin-alerte" class="alerte-incomplete" hidden></p>

    <button id="bouton-enregistrer" class="principal grand">Enregistrer et synchroniser</button>
    <p id="fin-message" class="message"></p>
  </main>
</section>

<!-- Réglages -->
<section id="ecran-reglages" class="ecran">
  <header class="barre">
    <button id="bouton-reglages-retour" class="icone" aria-label="Retour">&#8592;</button>
    <div class="barre-titre"><span>Réglages</span></div>
    <span class="icone"></span>
  </header>
  <main class="corps">
    <label class="champ-large">
      <span>Adresse du pont vers le classeur</span>
      <input id="reglage-pont" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec">
      <small>Déployez <code>appsscript/Code.gs</code> depuis le classeur, puis collez ici l'adresse du déploiement.</small>
    </label>
    <label class="champ-large">
      <span>Mot de passe du pont</span>
      <input id="reglage-secret" type="text" autocomplete="off" placeholder="celui inscrit dans le script">
    </label>
    <label class="bascule">
      <input id="reglage-son" type="checkbox" checked>
      <span>Signal sonore en fin de récupération</span>
    </label>
    <label class="bascule">
      <input id="reglage-vibration" type="checkbox" checked>
      <span>Vibration en fin de récupération</span>
    </label>
    <label class="bascule">
      <input id="reglage-veille" type="checkbox" checked>
      <span>Garder l'écran allumé pendant la séance</span>
    </label>
    <label class="bascule">
      <input id="reglage-clavier-recup" type="checkbox" checked>
      <span>Garder le clavier ouvert pendant la récupération
        <small>Seule façon d'être prêt à saisir dès la fin du compte à rebours,
        mais le clavier occupe le bas de l'écran pendant tout le repos.</small>
      </span>
    </label>
    <button id="bouton-tester-pont" class="discret">Tester le pont</button>
    <p id="reglages-message" class="message"></p>
    <hr>
    <button id="bouton-exporter" class="discret">Exporter les séances (JSON)</button>
    <button id="bouton-nettoyer-historique" class="discret">Ne garder que les séances d'aujourd'hui</button>
    <p class="note" id="note-programme"></p>
  </main>
</section>

<!-- Historique -->
<section id="ecran-historique" class="ecran">
  <header class="barre">
    <button id="bouton-historique-retour" class="icone" aria-label="Retour">&#8592;</button>
    <div class="barre-titre"><span>Séances enregistrées</span></div>
    <span class="icone"></span>
  </header>
  <main class="corps">
    <div id="liste-historique"></div>
  </main>
</section>

<script src="js/app.js"></script>
</body>
</html>
